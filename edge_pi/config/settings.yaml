# TerraTrace Edge Node Configuration
# Device metadata matching Supabase devices table
device:
  device_name: "pi-node-01"
  device_id: "11111111-1111-1111-1111-111111111111"
  location: "North Plot, Row 3"
  firmware_version: "1.0.0"
  model_version: "coffee_leaf_model_v1"

# Camera capture configuration
camera:
  # 'auto' selects PiCamera on Raspberry Pi, Webcam if available on PC, or falls back to sample image
  type: "auto"
  device_index: 0
  fallback_image: "data/sample_leaf.jpg"
  resolution: [640, 480]

# Hardware GPIO and Actuation settings
hardware:
  # 'auto' auto-detects RPi.GPIO on Linux/Pi, or falls back safely to 'mock' on Windows/Mac
  backend: "auto"
  relay_channel: 2
  relay_gpio_pin: 17
  # Most 5V optocoupler relay boards are Active LOW (pull LOW to energize coil)
  active_low: true
  # Absolute hardware safety ceiling: pump will be forced off if it runs beyond this
  max_spray_duration_seconds: 10.0

# Cloud Synchronization & Offline Queue
sync:
  enabled: true
  heartbeat_interval_seconds: 60
  offline_queue_db: "data/offline_queue.db"
  storage_bucket: "leaf-images"
